<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF7F1"/>
      <stop offset="40%" stop-color="#F7EBD2"/>
      <stop offset="100%" stop-color="#F8D8DE"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFD9B1"/>
      <stop offset="50%" stop-color="#D4AC70"/>
      <stop offset="100%" stop-color="#B8843D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#EFD9B1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#EFD9B1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F0B3BD" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F0B3BD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="200" cy="120" rx="320" ry="220" fill="url(#glow)"/>
  <ellipse cx="1050" cy="540" rx="360" ry="260" fill="url(#rose)"/>
  <ellipse cx="950" cy="100" rx="220" ry="160" fill="url(#glow)"/>

  <!-- Halo rings group -->
  <g transform="translate(900 315)" opacity="0.85">
    <circle r="180" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <circle r="140" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
    <circle r="100" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
    <circle r="55" fill="url(#gold)" opacity="0.9"/>
    <circle r="32" fill="#FBF7F1"/>
    <circle r="16" fill="url(#gold)"/>
  </g>

  <!-- Sparkles -->
  <g fill="url(#gold)" opacity="0.9">
    <path d="M 150 460 l 4 -16 l 4 16 l 16 4 l -16 4 l -4 16 l -4 -16 l -16 -4 z"/>
    <path d="M 400 120 l 3 -12 l 3 12 l 12 3 l -12 3 l -3 12 l -3 -12 l -12 -3 z"/>
    <path d="M 1100 200 l 3 -12 l 3 12 l 12 3 l -12 3 l -3 12 l -3 -12 l -12 -3 z"/>
    <path d="M 600 540 l 3 -11 l 3 11 l 11 3 l -11 3 l -3 11 l -3 -11 l -11 -3 z"/>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(80 200)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.7" stroke="#EFD9B1" stroke-width="1"/>
    <circle cx="18" cy="18" r="3" fill="#D4AC70"/>
    <text x="34" y="24" font-family="Outfit, sans-serif" font-size="13" font-weight="600" letter-spacing="3.2" fill="#553B28">SACRED SELF-CARE</text>
  </g>

  <!-- Headline -->
  <text x="80" y="320" font-family="Cormorant Garamond, Georgia, serif" font-size="92" font-weight="500" fill="#2A1B0F">My Divine</text>
  <text x="80" y="420" font-family="Cormorant Garamond, Georgia, serif" font-size="92" font-style="italic" font-weight="500" fill="url(#gold)">Aesthetics</text>

  <!-- Tagline -->
  <text x="80" y="475" font-family="Outfit, sans-serif" font-size="22" fill="#553B28" opacity="0.85">Where Beauty Feels Divine</text>

  <!-- Credentials pill -->
  <g transform="translate(80 520)">
    <rect x="0" y="0" width="500" height="44" rx="22" fill="#2A1B0F"/>
    <text x="28" y="29" font-family="Outfit, sans-serif" font-size="14" font-weight="500" letter-spacing="2.5" fill="#F7EBD2">IMANI BRYAN · DNP, FNP-C, PMHNP-BC</text>
  </g>
</svg>
